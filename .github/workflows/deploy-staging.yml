name: Deploy Staging

on:
  push:
    branches: [development]

# this workflow neither checks out code nor calls the GitHub API
permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging
        # pinned to a commit SHA: a tag can be re-pointed, a SHA cannot
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          # verify the server's host key so the connection cannot be hijacked
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          script: |
            # abort on the first failing step: never rebuild stale code and report success
            set -euo pipefail
            cd $GOODMAN_STAGING_DIR/project-goodman
            git checkout -- . && git clean -fd
            git pull origin development
            # Export env vars for docker compose build args
            set -a && source $GOODMAN_STAGING_DIR/.env.staging && set +a
            # Clean up any orphaned containers before rebuild
            docker compose -f docker-compose.staging.yml down --remove-orphans 2>/dev/null || true
            docker compose -f docker-compose.staging.yml up -d --build
            sleep 15
            curl -f http://localhost:3001/api/health || exit 1
            SMOKE_BASE_URL=http://localhost:3001 \
            SMOKE_ENV_FILE=$GOODMAN_STAGING_DIR/.env.staging \
            node scripts/smoke-test-staging.js

      - name: Notify on failure
        if: failure()
        run: echo "Staging deployment failed! Check the logs above for details."

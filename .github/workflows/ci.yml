name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test -- --run

      - name: Coverage
        run: npm run test:coverage

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Export CHROME_PATH for Lighthouse
        run: echo "CHROME_PATH=$(node -e \"const { chromium } = require('playwright'); console.log(chromium.executablePath());\")" >> $GITHUB_ENV

      - name: Start Next.js dev server (quality gates)
        if: ${{ hashFiles('tests/quality-baselines/performance/perf-baseline.json') != '' || hashFiles('tests/quality-baselines/lighthouse/*.json') != '' }}
        run: |
          NODE_ENV=development PERF_TEST_MODE=true REDIS_DISABLED=true \
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }} \
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }} \
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY || 'sk-placeholder-for-ci-build' }} \
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }} \
          npm run dev -- --hostname 127.0.0.1 --port 3100 > /tmp/next-dev.log 2>&1 &
          echo $! > /tmp/next-dev.pid
          sleep 15

      - name: Perf regression gate
        if: ${{ hashFiles('tests/quality-baselines/performance/perf-baseline.json') != '' }}
        run: npm run test:perf
        env:
          NODE_ENV: development
          PERF_TEST_MODE: 'true'
          PERF_BASE_URL: http://127.0.0.1:3100

      - name: Lighthouse regression gate
        if: ${{ hashFiles('tests/quality-baselines/lighthouse/*.json') != '' }}
        run: npm run test:lighthouse:gate
        env:
          LHCI_BASE_URL: http://127.0.0.1:3100

      - name: Stop Next.js dev server (quality gates)
        if: ${{ always() && (hashFiles('tests/quality-baselines/performance/perf-baseline.json') != '' || hashFiles('tests/quality-baselines/lighthouse/*.json') != '') }}
        run: |
          if [ -f /tmp/next-dev.pid ]; then
            kill "$(cat /tmp/next-dev.pid)"
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: E2E (Playwright, non-blocking)
        run: npm run test:e2e
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-placeholder-for-ci-build' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true  # Don't fail on known unfixable vulnerabilities

      - name: Build
        run: npm run build
        env:
          # Provide required env vars for build (non-sensitive placeholders)
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-placeholder-for-ci-build' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}

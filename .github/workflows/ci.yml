name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    # A green run takes 4–7 min; without a cap a hung step holds the run for GitHub's 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test -- --run

      - name: Coverage
        run: npm run test:coverage

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Export CHROME_PATH for Lighthouse
        run: |
          CHROME_PATH="$(node -e 'const { chromium } = require("playwright"); console.log(chromium.executablePath());')"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Start Next.js dev server (quality gates)
        if: ${{ hashFiles('tests/quality-baselines/lighthouse/*.json') != '' || hashFiles('tests/quality-baselines/a11y/a11y-baseline.json') != '' }}
        run: |
          NODE_ENV=development REDIS_DISABLED=true \
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }} \
          LLM_API_KEY=placeholder-llm-key LLM_BASE_URL=http://127.0.0.1:9/v1 \
          SUPABASE_SECRET_KEY=placeholder-secret-key \
          npm run dev -- --hostname 127.0.0.1 --port 3100 > /tmp/next-dev.log 2>&1 &
          echo $! > /tmp/next-dev.pid
          sleep 15

      - name: Lighthouse regression gate
        if: ${{ hashFiles('tests/quality-baselines/lighthouse/*.json') != '' }}
        run: npm run test:lighthouse:gate
        env:
          LHCI_BASE_URL: http://127.0.0.1:3100

      - name: A11y regression gate
        if: ${{ hashFiles('tests/quality-baselines/a11y/a11y-baseline.json') != '' }}
        run: npm run test:a11y
        env:
          A11Y_BASE_URL: http://127.0.0.1:3100

      - name: Stop Next.js dev server (quality gates)
        if: ${{ always() && (hashFiles('tests/quality-baselines/lighthouse/*.json') != '' || hashFiles('tests/quality-baselines/a11y/a11y-baseline.json') != '') }}
        run: |
          if [ -f /tmp/next-dev.pid ]; then
            kill "$(cat /tmp/next-dev.pid)" || true
          fi
          # Clean up Next.js dev lock file to allow E2E tests to start their own server
          rm -f .next/dev/lock

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: E2E (Playwright, non-blocking)
        run: npm run test:e2e
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          LLM_API_KEY: placeholder-llm-key
          LLM_BASE_URL: http://127.0.0.1:9/v1
          # CI never holds a real database key: the secret key bypasses every row rule
          SUPABASE_SECRET_KEY: placeholder-secret-key

      - name: Security audit
        run: npm run test:audit

      - name: Build
        run: npm run build
        env:
          # The build needs no database key (DESIGN invariant 5): none is given
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
